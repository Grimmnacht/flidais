<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Atendimento</title>
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="bg-gray-50 dark:bg-zinc-900 min-h-screen flex flex-col pb-12 transition-colors duration-300">

    <header class="bg-emerald-950 text-white py-4 px-6 shadow-lg border-b border-emerald-900 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <button id="btnVoltar" class="text-white hover:text-emerald-300 transition flex items-center justify-center p-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" />
                </svg>
            </button>
            <h1 id="atendimentoTitulo" class="text-xl font-bold font-serif tracking-wide text-emerald-50">Atendimento</h1>
        </div>

        <button id="themeToggleBtn" title="Alternar Tema" class="text-emerald-100/80 hover:text-white transition focus:outline-none">
            <svg id="themeIconDark" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" /></svg>
            <svg id="themeIconLight" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /></svg>
        </button>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 mt-6 space-y-6">
        <div>
            <label class="block text-xs font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-2">Selecionar Protocolo</label>
            <div class="relative">
                <select id="protocoloSelect" class="w-full px-4 py-3 bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded-xl text-gray-800 dark:text-zinc-100 shadow-sm focus:outline-none focus:border-emerald-600 appearance-none font-medium cursor-pointer transition-colors">
                    <option value="">-- Escolha um modelo base --</option>
                    <option value="1">Pós-Operatório Padrão</option>
                    <option value="2">Vacinação</option>
                    <option value="3">Tratamento de Pele</option>
                    <option value="4">Vermifugação</option>
                    <option value="5">Controle de Pulgas e Carrapatos</option>
                    <option value="6">Manejo de Diarreia / Gastroenterite</option>
                    <option value="7">Limpeza e Tratamento de Ouvido / Otite</option>
                    <option value="8">Cuidado com Trauma / Ferimento Aberto</option>
                    <option value="9">Manejo de Suspeita de Envenenamento / Intoxicação</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    ▼
                </div>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-2">Evolução / Tratamento Clínico</label>
            <textarea id="evolucaoTexto" rows="10" 
                class="w-full p-4 bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded-2xl text-gray-700 dark:text-zinc-100 shadow-sm focus:outline-none focus:border-emerald-600 transition font-mono text-sm leading-relaxed"
                placeholder="Selecione um protocolo ou digite a evolução do paciente aqui..."></textarea>
        </div>

        <div class="flex flex-col gap-3 mt-4">
            <button id="btnFinalizarEnviar" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9" /><path d="M9 10a.5 .5 0 0 0 1 0v-1a.5 .5 0 0 0 -1 0v1a5 5 0 0 0 5 5h1a.5 .5 0 0 0 0 -1h-1a.5 .5 0 0 0 0 1" /></svg>
                Finalizar e Enviar
            </button>

            <button id="btnAbrirModalCancelar" 
                class="w-full bg-white dark:bg-zinc-800 hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50 font-bold py-3.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7h16" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg>
                Cancelar Agendamento
            </button>
        </div>

    </main>

    <div id="modalCancelar" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-zinc-800 w-full max-w-sm rounded-2xl shadow-xl border border-transparent dark:border-zinc-700 p-6 transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold text-gray-800 dark:text-zinc-100 mb-2">Cancelar Consulta?</h3>
            <p class="text-sm text-gray-500 dark:text-zinc-400 mb-6">Esta ação não excluirá o paciente, mas removerá este agendamento específico da sua agenda.</p>
            <div class="flex gap-3 justify-end">
                <button id="btnFecharModalCancelar" class="px-4 py-2 text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 dark:bg-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-600 rounded-xl transition">Voltar</button>
                <button id="btnConfirmarCancelar" class="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl transition flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 stroke-white fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7h16" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg>
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <script src="js/shared.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/atendimento.js"></script>
</body>
</html>
