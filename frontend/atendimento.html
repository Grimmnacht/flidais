<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pb-12">

    <header class="bg-emerald-800 text-white py-4 px-6 shadow-md flex items-center gap-4">
        <button id="btnVoltar" class="text-xl hover:text-emerald-200 transition">←</button>
        <h1 id="atendimentoTitulo" class="text-xl font-bold font-serif tracking-wide">Atendimento</h1>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 mt-6 space-y-6">
        
        <div>
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Selecionar Protocolo</label>
            <div class="relative">
                <select id="protocoloSelect" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-gray-800 shadow-sm focus:outline-none focus:border-emerald-600 appearance-none font-medium cursor-pointer">
                    <option value="">-- Escolha um modelo base --</option>
                    <option value="1">Pós-Operatório Padrão</option>
                    <option value="2">Vacinação</option>
                    <option value="3">Tratamento de Pele</option>
                    <option value="4">Vermifugação</option>
                    <option value="5">Controle de Pulgas e Carrapatos</option>
                    <option value="6">Manejo de Diarreia / Gastroenterite</option>
                    <option value="7">Limpeza e Tratamento de Ouvido / Otite</option>
                    <option value="8">Cuidado com Trauma / Ferimento Aberto</option>
                    <option value="9">Manejo de Suspeita de Envenenamento / Intoxicação</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    ▼
                </div>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Evolução / Tratamento Clínico</label>
            <textarea id="evolucaoTexto" rows="10" 
                class="w-full p-4 bg-white border border-gray-200 rounded-2xl text-gray-700 shadow-sm focus:outline-none focus:border-emerald-600 transition font-mono text-sm leading-relaxed"
                placeholder="Selecione um protocolo ou digite a evolução do paciente aqui..."></textarea>
        </div>

        <div class="flex flex-col gap-3 mt-4">
            <button id="btnFinalizarEnviar" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9" />
                    <path d="M9 10a.5 .5 0 0 0 1 0v-1a.5 .5 0 0 0 -1 0v1a5 5 0 0 0 5 5h1a.5 .5 0 0 0 0 -1h-1a.5 .5 0 0 0 0 1" />
                </svg>
                Finalizar e Enviar
            </button>

            <button id="btnAbrirModalCancelar" 
                class="w-full bg-white hover:bg-red-50 text-red-600 border border-red-200 font-bold py-3.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M4 7h16" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                    <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
                </svg>
                Cancelar Agendamento
            </button>
        </div>

    </main>

    <div id="modalCancelar" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold text-gray-800 mb-2">Cancelar Consulta?</h3>
            <p class="text-sm text-gray-500 mb-6">Esta ação não excluirá o paciente, mas removerá este agendamento específico da sua agenda.</p>
            <div class="flex gap-3 justify-end">
                <button id="btnFecharModalCancelar" class="px-4 py-2 text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition focus:outline-none">Voltar</button>
                <button id="btnConfirmarCancelar" class="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl transition flex items-center gap-2 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M4 7h16" />
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                        <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                        <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
                    </svg>
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <script src="js/atendimento.js"></script>
</body>
</html>
