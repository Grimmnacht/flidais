<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Novo Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pb-12">

    <header class="bg-emerald-800 text-white py-4 px-6 shadow-md flex items-center gap-4">
        <button id="btnVoltar" class="text-xl hover:text-emerald-200 transition">←</button>
        <h1 class="text-xl font-bold font-serif tracking-wide">Novo Cadastro</h1>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 mt-6">
        <form id="cadastroForm" class="space-y-6">
            
            <div>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Dados do Animal</h2>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Pet</label>
                        <input type="text" id="petNome" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition" placeholder="Ex: Thor">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Espécie</label>
                            <input type="text" id="petEspecie" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition" placeholder="Ex: Cão">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Raça</label>
                            <input type="text" id="petRaca" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition" placeholder="Ex: Poodle">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Peso (kg)</label>
                        <input type="number" step="0.1" id="petPeso" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition" placeholder="Ex: 12.5">
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Dados do Tutor</h2>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Tutor</label>
                        <input type="text" id="tutorNome" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition" placeholder="Nome Completo">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">WhatsApp / Telefone</label>
                        <input type="tel" id="tutorTelefone" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition" placeholder="Ex: 319XXXXXXXX">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">E-mail do Tutor</label>
                        <input type="email" id="tutorEmail" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition" placeholder="Ex: tutor@email.com">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition mt-4">
                Finalizar Cadastro
            </button>
        </form>
    </main>

    <script src="js/cadastro.js"></script>
</body>
</html>
