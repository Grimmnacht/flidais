<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
<style>
        body {
            --s: 220px; /* control the size*/
            --c1: #4fab66;
            --c2: #377647;
            
            --_g:radial-gradient(#0000 60%,var(--c1) 61% 63%,#0000 64% 77%,var(--c1) 78% 80%,#0000 81%);
            --_c:,#0000 75%,var(--c2) 0;
            background:
                conic-gradient(at 12% 20% var(--_c)) calc(var(--s)* .44) calc(.9*var(--s)),
                conic-gradient(at 12% 20% var(--_c)) calc(var(--s)*-.06) calc(.4*var(--s)),
                conic-gradient(at 20% 12% var(--_c)) calc(.9*var(--s)) calc(var(--s)* .44),
                conic-gradient(at 20% 12% var(--_c)) calc(.4*var(--s)) calc(var(--s)*-.06),
                var(--_g),var(--_g) calc(var(--s)/2) calc(var(--s)/2) var(--c2);
            background-size: var(--s) var(--s);
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-center items-center px-4">

</head>
<body class="bg-gray-50 h-screen flex flex-col justify-center items-center px-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm border border-gray-100 text-center">
        
        <div class="mb-6 flex flex-col items-center">
            <div class="text-emerald-800 text-4xl mb-2">🌳</div>
            <h1 class="text-3xl font-bold text-emerald-900 tracking-wide font-serif">Flidais</h1>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-wider">Gestão Veterinária</p>
        </div>

        <form id="loginForm" class="space-y-4 text-left">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition"
                    placeholder="seu@email.com">
            </div>

            <div>
                <label for="senha" class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
                <input type="password" id="senha" required
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition"
                    placeholder="••••••••">
            </div>

            <div id="errorMessage" class="text-red-500 text-sm hidden text-center font-medium">
                E-mail ou senha incorretos.
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition mt-6">
                Entrar
            </button>

            <div class="text-center mt-4">
                <a href="cadastro-usuario.html" class="text-sm text-emerald-700 hover:text-emerald-900 font-medium transition">
                    Não tem uma conta? Cadastre-se aqui
                </a>
            </div>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
