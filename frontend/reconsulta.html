<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Agendar Reconsulta</title>
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="bg-gray-50 dark:bg-zinc-900 min-h-screen flex flex-col pb-12 transition-colors duration-300">

    <header class="bg-emerald-950 text-white py-4 px-6 shadow-lg border-b border-emerald-900 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <button id="btnVoltar" class="text-white hover:text-emerald-300 transition flex items-center justify-center p-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" />
                </svg>
            </button>
            <h1 class="text-xl font-bold font-serif tracking-wide text-emerald-50">Agendar Reconsulta</h1>
        </div>

        <button id="themeToggleBtn" title="Alternar Tema" class="text-emerald-100/80 hover:text-white transition focus:outline-none">
            <svg id="themeIconDark" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" /></svg>
            <svg id="themeIconLight" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /></svg>
        </button>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 mt-6">
        <form id="reconsultaForm" class="space-y-6">
            <div>
                <h2 class="text-xs font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">Escolher Paciente</h2>
                <div class="bg-white dark:bg-zinc-800 p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-zinc-700/80 space-y-4 transition-colors">
                    <div>
                        <label for="petSelect" class="block text-sm font-semibold text-gray-700 dark:text-zinc-300 mb-1">Nome do Animal</label>
                        <div class="relative">
                            <select id="petSelect" required class="w-full px-4 py-2.5 bg-gray-50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl text-gray-800 dark:text-zinc-100 focus:outline-none focus:border-emerald-600 transition appearance-none font-medium cursor-pointer">
                                <option value="">-- Buscando pacientes... --</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                ▼
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-xs font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">Nova Sessão</h2>
                <div class="bg-white dark:bg-zinc-800 p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-zinc-700/80 space-y-4 transition-colors">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="agendaData" class="block text-sm font-semibold text-gray-700 dark:text-zinc-300 mb-1">Data</label>
                            <input type="date" id="agendaData" required class="w-full px-4 py-2 bg-gray-50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl text-gray-800 dark:text-zinc-100 focus:outline-none focus:border-emerald-600 transition">
                        </div>
                        <div>
                            <label for="agendaHorario" class="block text-sm font-semibold text-gray-700 dark:text-zinc-300 mb-1">Horário</label>
                            <input type="time" id="agendaHorario" required class="w-full px-4 py-2 bg-gray-50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl text-gray-800 dark:text-zinc-100 focus:outline-none focus:border-emerald-600 transition">
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-xs font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">Observações Clínicas</h2>
                <div class="bg-white dark:bg-zinc-800 p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-zinc-700/80 transition-colors">
                    <label for="observacao" class="block text-sm font-semibold text-gray-700 dark:text-zinc-300 mb-1">Lembrete Interno para o Vet</label>
                    <textarea id="observacao" rows="2" class="w-full px-4 py-2 bg-gray-50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl text-gray-800 dark:text-zinc-100 focus:outline-none focus:border-emerald-600 transition resize-none" placeholder="Ex: Retorno de pontos, animal mais calmo hoje..."></textarea>
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition mt-4">
                Confirmar Agendamento
            </button>
        </form>
    </main>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <script src="js/theme.js"></script>
    <script src="js/reconsulta.js"></script>
</body>
</html>
