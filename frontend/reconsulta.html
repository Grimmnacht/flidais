<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Agendar Reconsulta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pb-12">

    <header class="bg-emerald-800 text-white py-4 px-6 shadow-md flex items-center gap-4">
        <button id="btnVoltar" class="text-xl hover:text-emerald-200 transition">←</button>
        <h1 class="text-xl font-bold font-serif tracking-wide">Agendar Reconsulta</h1>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 mt-6">
        <form id="reconsultaForm" class="space-y-6">
            
            <div>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Escolher Paciente</h2>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <div>
                        <label for="petSelect" class="block text-sm font-semibold text-gray-700 mb-1">Nome do Animal</label>
                        <div class="relative">
                            <select id="petSelect" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition appearance-none font-medium cursor-pointer">
                                <option value="">-- Buscando pacientes... --</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                ▼
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Nova Sessão</h2>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="agendaData" class="block text-sm font-semibold text-gray-700 mb-1">Data</label>
                            <input type="date" id="agendaData" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition">
                        </div>
                        <div>
                            <label for="agendaHorario" class="block text-sm font-semibold text-gray-700 mb-1">Horário</label>
                            <input type="time" id="agendaHorario" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition">
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Observações Clínicas</h2>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <label for="observacao" class="block text-sm font-semibold text-gray-700 mb-1">Lembrete Interno para o Vet</label>
                    <textarea id="observacao" rows="2" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition resize-none" placeholder="Ex: Retorno de pontos, animal mais calmo hoje..."></textarea>
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition mt-4">
                Confirmar Agendamento
            </button>
        </form>
    </main>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <script src="js/reconsulta.js"></script>
</body>
</html>
