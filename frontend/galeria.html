<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Galeria de Pacientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pb-12">

    <header class="bg-emerald-800 text-white py-4 px-6 shadow-md flex items-center gap-4">
        <button id="btnVoltar" class="text-xl hover:text-emerald-200 transition">←</button>
        <h1 class="text-xl font-bold font-serif tracking-wide">Galeria de Pacientes</h1>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 mt-6 flex flex-col gap-4">
        
        <div class="relative w-full">
            <input type="text" id="searchBar" 
                class="w-full px-4 py-3 bg-white border border-gray-200 rounded-2xl text-gray-800 shadow-sm focus:outline-none focus:border-emerald-600 transition font-medium text-sm"
                placeholder="Pesquise por pet, espécie ou tutor...">
        </div>

        <div id="galeriaLista" class="space-y-4">
            <p class="text-gray-400 text-center py-8">Carregando pacientes...</p>
        </div>
    </main>

    <div id="modalHistorico" class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl shadow-xl max-h-[80vh] flex flex-col overflow-hidden transform translate-y-10 transition-transform duration-300">
            
            <div class="p-6 border-b border-gray-100 flex justify-between items-start bg-gray-50">
                <div>
                    <h3 id="modalPetNome" class="text-2xl font-bold text-gray-800">Nome do Pet</h3>
                    <p id="modalPetDetalhes" class="text-xs text-gray-400 font-semibold uppercase tracking-wider mt-0.5">Espécie - Raça</p>
                </div>
                <button id="btnCloseModal" class="text-gray-400 hover:text-gray-600 text-2xl font-semibold px-2">×</button>
            </div>

            <div id="modalCorpoTimeline" class="p-6 overflow-y-auto flex-1 space-y-6">
                </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <script src="js/galeria.js"></script>
</body>
</html>
