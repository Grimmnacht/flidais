<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pb-24">

    <header class="bg-emerald-800 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 stroke-white fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M12 13l-2 -2" />
                <path d="M12 12l2 -2" />
                <path d="M12 21v-13" />
                <path d="M9.824 16a3 3 0 0 1 -2.743 -3.69l.862 -2.762c.105 -.333 .471 -.54 .808 -.464l.948 .215c.068 .016 .139 .016 .207 0l.948 -.215c.337 -.076 .703 .131 .808 .464l.862 2.762a3 3 0 0 1 -2.743 3.69z" />
                <path d="M14.176 16a3 3 0 0 0 2.743 -3.69l-.862 -2.762c-.105 -.333 -.471 -.54 -.808 -.464l-.948 .215c-.068 .016 -.139 .016 -.207 0l-.948 -.215c-.337 -.076 -.703 .131 -.808 .464l-.862 2.762a3 3 0 0 0 2.743 3.69z" />
            </svg>
            <h1 class="text-xl font-bold font-serif tracking-wide">Flidais</h1>
        </div>
        <span id="vetName" class="text-sm font-medium text-emerald-100">Veterinário</span>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 mt-6">
        
        <div class="mb-6 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Agenda de Hoje</h2>
                <p id="currentDate" class="text-sm text-gray-400 font-medium mt-0.5">Carregando data...</p>
            </div>
            
            <a href="galeria.html" class="text-emerald-700 bg-emerald-100 hover:bg-emerald-200 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition shadow-sm border border-emerald-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2" />
                </svg>
                Galeria
            </a>
        </div>

        <div id="agendaLista" class="space-y-4">
            <p class="text-gray-500 text-center py-8">Buscando atendimentos no banco...</p>
        </div>

    </main>

    <div id="modalCancelar" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold text-gray-800 mb-2">Cancelar Agendamento?</h3>
            <p class="text-sm text-gray-500 mb-6">Esta ação removerá o paciente da agenda de hoje. O histórico será mantido como cancelado no sistema.</p>
            <div class="flex gap-3 justify-end">
                <button id="btnFecharModalCancelar" class="px-4 py-2 text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition focus:outline-none">Voltar</button>
                <button id="btnConfirmarCancelar" class="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl transition flex items-center gap-2 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 stroke-white fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M4 7h16" />
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                        <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                        <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
                    </svg>
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <button id="btnReconsulta" title="Agendar Reconsulta"
        class="fixed bottom-6 left-6 w-14 h-14 bg-emerald-700 hover:bg-emerald-800 text-white rounded-full shadow-lg transition duration-300 transform active:scale-95 flex items-center justify-center focus:outline-none select-none z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 stroke-white fill-none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
            <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
        </svg>
    </button>

    <button id="btnNovoCadastro" title="Novo Cadastro"
        class="fixed bottom-6 right-6 w-14 h-14 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full shadow-lg transition duration-300 transform active:scale-95 flex items-center justify-center text-3xl font-light pb-1 focus:outline-none select-none z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 stroke-white fill-none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M12 5l0 14" />
            <path d="M5 12l14 0" />
        </svg>
    </button>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <script src="js/dashboard.js"></script>
</body>
</html>
