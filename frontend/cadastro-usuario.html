<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            --s: 220px;
            --c1: #4fab66;
            --c2: #377647;
            
            --_g:radial-gradient(#0000 60%,var(--c1) 61% 63%,#0000 64% 77%,var(--c1) 78% 80%,#0000 81%);
            --_c:,#0000 75%,var(--c2) 0;
            background:
                conic-gradient(at 12% 20% var(--_c)) calc(var(--s)* .44) calc(.9*var(--s)),
                conic-gradient(at 12% 20% var(--_c)) calc(var(--s)*-.06) calc(.4*var(--s)),
                conic-gradient(at 20% 12% var(--_c)) calc(.9*var(--s)) calc(var(--s)* .44),
                conic-gradient(at 20% 12% var(--_c)) calc(.4*var(--s)) calc(var(--s)*-.06),
                var(--_g),var(--_g) calc(var(--s)/2) calc(var(--s)/2) var(--c2);
            background-size: var(--s) var(--s);
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-center items-center px-4">

    <div class="bg-emerald-950 p-8 rounded-2xl shadow-2xl w-full max-w-sm border border-emerald-900 text-center">
        
        <div class="mb-6 flex flex-col items-center">
            <img src="img/arvore-celta.png" alt="Símbolo Flidais" class="w-16 h-16 mb-2 object-contain drop-shadow-lg opacity-90 transition transform hover:scale-105 duration-500">
            <h1 class="text-2xl font-bold text-emerald-50 tracking-wide font-serif">Criar Nova Conta</h1>
            <p class="text-xs text-emerald-300/70 mt-1 uppercase tracking-wider">Cadastro de Veterinário</p>
        </div>

        <form id="cadastroUsuarioForm" class="space-y-4 text-left">
            <div>
                <label for="nome" class="block text-sm font-semibold text-emerald-100 mb-1">Nome Completo</label>
                <input type="text" id="nome" required
                    class="w-full px-4 py-2.5 bg-emerald-900/50 border border-emerald-800 rounded-xl text-emerald-50 placeholder-emerald-700 focus:outline-none focus:border-emerald-500 transition"
                    placeholder="Seu nome completo">
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-emerald-100 mb-1">E-mail Profissional</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-2.5 bg-emerald-900/50 border border-emerald-800 rounded-xl text-emerald-50 placeholder-emerald-700 focus:outline-none focus:border-emerald-500 transition"
                    placeholder="seu@email.com">
            </div>

            <div>
                <label for="senha" class="block text-sm font-semibold text-emerald-100 mb-1">Senha de Acesso</label>
                <input type="password" id="senha" required
                    class="w-full px-4 py-2.5 bg-emerald-900/50 border border-emerald-800 rounded-xl text-emerald-50 placeholder-emerald-700 focus:outline-none focus:border-emerald-500 transition"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-md transition mt-6">
                Cadastrar e Entrar
            </button>
        </form>

        <div class="mt-6 text-sm">
            <a href="index.html" class="text-emerald-400 hover:text-emerald-300 font-medium transition">
                ← Já tenho uma conta (Fazer Login)
            </a>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <script src="js/shared.js"></script>
    <script src="js/cadastro-usuario.js"></script>
</body>
</html>
