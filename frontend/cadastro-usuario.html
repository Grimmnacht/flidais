<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flidais - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col justify-center items-center px-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm border border-gray-100 text-center">
        
        <div class="mb-6 flex flex-col items-center">
            <div class="text-emerald-800 text-4xl mb-2">🌳</div>
            <h1 class="text-2xl font-bold text-emerald-900 tracking-wide font-serif">Criar Nova Conta</h1>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-wider">Cadastro de Veterinário</p>
        </div>

        <form id="cadastroUsuarioForm" class="space-y-4 text-left">
            <div>
                <label for="nome" class="block text-sm font-semibold text-gray-700 mb-1">Nome Completo</label>
                <input type="text" id="nome" required
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition"
                    placeholder="Seu nome completo">
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">E-mail Profissional</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition"
                    placeholder="seu@email.com">
            </div>

            <div>
                <label for="senha" class="block text-sm font-semibold text-gray-700 mb-1">Senha de Acesso</label>
                <input type="password" id="senha" required
                    class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:border-emerald-600 transition"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition mt-6">
                Cadastrar e Entrar
            </button>
        </form>

        <div class="mt-6 text-sm">
            <a href="index.html" class="text-emerald-700 hover:text-emerald-900 font-medium transition">
                ← Já tenho uma conta (Fazer Login)
            </a>
        </div>
    </div>

    <script src="js/cadastro-usuario.js"></script>
</body>
</html>
